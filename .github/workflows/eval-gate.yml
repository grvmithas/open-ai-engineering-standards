name: Evaluation Gate

on:
  pull_request:
    paths:
      - 'content/**/*.prompt.md'
      - 'content/**/*.agent.md'
      - 'content/**/*.skill.md'
      - 'eval/**'
      - '.github/workflows/eval-gate.yml'

permissions:
  contents: read

jobs:
  evaluation-gate:
    name: LLM Evaluation Gate
    runs-on: ubuntu-latest
    env:
      HAS_EVAL_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Forks and repos without the secret get an explicit, visible skip — never a silent pass.
      - name: Skip notice when credentials are absent
        if: env.HAS_EVAL_KEY != 'true'
        run: |
          echo "::notice title=Evaluation gate skipped::OPENAI_API_KEY is not configured for this run (fork PR or unset secret). No evaluation result was produced; a maintainer must re-run on a trusted branch before merge."
          {
            echo "### Evaluation gate: SKIPPED"
            echo ""
            echo "No \`OPENAI_API_KEY\` secret was available, so no evaluation ran."
            echo "This is **not** a pass. Re-run on a trusted branch before merging prompt/agent/skill changes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        if: env.HAS_EVAL_KEY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluation dependencies
        if: env.HAS_EVAL_KEY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install deepeval

      - name: Run DeepEval test suite
        if: env.HAS_EVAL_KEY == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPEVAL_API_KEY: ${{ secrets.DEEPEVAL_API_KEY }}
        run: deepeval test run eval/ --verbose
