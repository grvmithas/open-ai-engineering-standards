name: Release create-aies-kit

# Tag-driven: push `create-aies-kit-v2.0.0` after bumping packages/create-aies-kit/package.json
# and adding a CHANGELOG.md entry. Publishing never reads a local .env.
on:
  push:
    tags: ['create-aies-kit-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify only (no publish)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-create-aies-kit
  cancel-in-progress: false

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./packages/create-aies-kit/package.json').version")
          TAG="${GITHUB_REF_NAME#create-aies-kit-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"; exit 1
          fi
          grep -q "## \[$PKG\]" packages/create-aies-kit/CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no entry for $PKG"; exit 1;
          }

      - name: Full test suite (includes kit conformance)
        run: npm test

      - name: Embedded corpus is current
        run: |
          npm run kit:embed
          git diff --exit-code -- packages/kit-core/lib/embedded-corpus.js

  publish:
    name: Publish to npm with provenance
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 supports OIDC trusted publishing; provenance is attached automatically.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Pack (runs prepack → vendor)
        working-directory: packages/create-aies-kit
        run: |
          npm pack --dry-run
          npm pack

      - name: Smoke the packed tarball
        working-directory: packages/create-aies-kit
        run: |
          TARBALL="$GITHUB_WORKSPACE/packages/create-aies-kit/$(ls grvmithas-create-aies-kit-*.tgz)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke" && git init -q
          echo '{"name":"smoke","scripts":{"lint":"eslint .","typecheck":"tsc --noEmit","test":"vitest run"}}' > package.json
          # A bare tarball path is executed as a shell command by npm 11; name the bin explicitly.
          kit() { npm exec --yes --package "$TARBALL" -- create-aies-kit "$@"; }
          kit --stack nextjs --ide claude-code --role fullstack --maturity advanced --goal new-product --model claude --data-class internal --yes
          grep -q 'npm run lint' AGENTS.md
          node hooks/aies-guard.mjs --self-test
          kit audit --min-score 100
          # Upgrade must keep user edits
          echo "TEAM RULE" >> AGENTS.md
          kit enhance
          grep -q 'TEAM RULE' AGENTS.md

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
        working-directory: packages/create-aies-kit
        env:
          # Empty when trusted publishing is configured on npmjs.com (preferred); otherwise a granular automation token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
